<svg viewBox="0 0 1000 1500" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3a4a5c"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1500" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="500" y="50" text-anchor="middle" fill="#e6edf3" font-size="26" font-weight="700" letter-spacing="0.5">Recoup</text>
  <text x="500" y="76" text-anchor="middle" fill="#7d8ea3" font-size="14">Detect → Diagnose → Decide → Act, with guardrails and a full audit trail at every step</text>

  <!-- ===== Gateway Adapter Layer ===== -->
  <rect x="330" y="110" width="340" height="60" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="500" y="134" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Payment Gateway (via Adapter Layer)</text>
  <text x="500" y="153" text-anchor="middle" fill="#7d8ea3" font-size="11">Razorpay today · pluggable for other gateways</text>

  <line x1="500" y1="170" x2="500" y2="200" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="190" fill="#5eead4" font-size="10.5">webhook: payment.failed / .authorized / payment_link.paid</text>

  <!-- ===== Webhook Listener ===== -->
  <rect x="330" y="205" width="340" height="55" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="500" y="227" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Webhook Listener</text>
  <text x="500" y="246" text-anchor="middle" fill="#7d8ea3" font-size="11">HMAC signature verified before anything else runs</text>

  <line x1="500" y1="260" x2="500" y2="290" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Event Logger ===== -->
  <rect x="330" y="295" width="340" height="55" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="500" y="317" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Event Logger</text>
  <text x="500" y="336" text-anchor="middle" fill="#7d8ea3" font-size="11">writes payment_events — audit trail starts here</text>

  <line x1="500" y1="350" x2="500" y2="380" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="370" fill="#5eead4" font-size="10.5">fires automatically — no human trigger needed</text>

  <!-- ===== Diagnosis Engine ===== -->
  <rect x="290" y="385" width="420" height="70" rx="8" fill="#12213a" stroke="#5eead4" stroke-width="1.5"/>
  <text x="500" y="411" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Diagnosis Engine (auto-fires on webhook arrival)</text>
  <text x="500" y="430" text-anchor="middle" fill="#9fb0c3" font-size="11">Rule table for known error codes → Gemini Flash-Lite fallback for unknown</text>
  <text x="500" y="446" text-anchor="middle" fill="#7d8ea3" font-size="10.5">LLM output restricted to a fixed action set — invalid output auto-overrides to escalate_to_human</text>

  <line x1="500" y1="455" x2="500" y2="485" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Decision Engine ===== -->
  <rect x="270" y="490" width="460" height="95" rx="8" fill="#12213a" stroke="#5eead4" stroke-width="1.5"/>
  <text x="500" y="516" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Decision Engine — Rule-Based Guardrails</text>
  <text x="500" y="535" text-anchor="middle" fill="#9fb0c3" font-size="11">Not LLM-controlled. Checks in order:</text>
  <text x="500" y="552" text-anchor="middle" fill="#9fb0c3" font-size="11">opt-out status → active commitment (promise-to-pay) → cause-specific</text>
  <text x="500" y="568" text-anchor="middle" fill="#9fb0c3" font-size="11">retry cap / cooldown → escalation rules</text>

  <line x1="500" y1="585" x2="500" y2="615" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="605" fill="#5eead4" font-size="10.5">decision = proceed</text>

  <!-- ===== Human Approval Checkpoint ===== -->
  <rect x="250" y="620" width="500" height="70" rx="8" fill="#241a10" stroke="#f0b95e" stroke-width="1.5"/>
  <text x="500" y="647" text-anchor="middle" fill="#f0b95e" font-size="15" font-weight="700">⏸ Human Approval Checkpoint</text>
  <text x="500" y="665" text-anchor="middle" fill="#d9b98a" font-size="11">Single tap on dashboard — nothing reaches a customer without merchant sign-off</text>
  <text x="500" y="680" text-anchor="middle" fill="#a3895f" font-size="10">blocked / escalated decisions skip this and route straight to the escalation queue</text>

  <line x1="500" y1="690" x2="500" y2="720" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="710" fill="#5eead4" font-size="10.5">approved</text>

  <!-- ===== Recovery Action ===== -->
  <rect x="270" y="725" width="460" height="95" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="500" y="751" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Recovery Action Executed</text>
  <text x="500" y="770" text-anchor="middle" fill="#9fb0c3" font-size="11">Real Razorpay Payment Link created (24h bounded expiry)</text>
  <text x="500" y="787" text-anchor="middle" fill="#9fb0c3" font-size="11">+ Resend email carrying the payment link and a tokenized</text>
  <text x="500" y="804" text-anchor="middle" fill="#9fb0c3" font-size="11">"manage this payment" link</text>

  <line x1="500" y1="820" x2="500" y2="850" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Customer response branch ===== -->
  <rect x="80" y="855" width="380" height="90" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="270" y="880" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">Customer pays</text>
  <text x="270" y="898" text-anchor="middle" fill="#9fb0c3" font-size="10.5">payment_link.paid webhook fires</text>
  <text x="270" y="914" text-anchor="middle" fill="#9fb0c3" font-size="10.5">→ outcome auto-set to "recovered"</text>
  <text x="270" y="932" text-anchor="middle" fill="#9fb0c3" font-size="10.5">→ any active commitment marked fulfilled</text>

  <rect x="540" y="855" width="380" height="90" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1.5"/>
  <text x="730" y="880" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="700">Customer replies instead</text>
  <text x="730" y="898" text-anchor="middle" fill="#9fb0c3" font-size="10.5">taps manage-payment link, types free text</text>
  <text x="730" y="914" text-anchor="middle" fill="#9fb0c3" font-size="10.5">LLM parses intent → promised_to_pay /</text>
  <text x="730" y="932" text-anchor="middle" fill="#9fb0c3" font-size="10.5">already_paid / opt_out / unclear</text>

  <line x1="270" y1="850" x2="270" y2="855" stroke="#5eead4" stroke-width="2"/>
  <line x1="730" y1="850" x2="730" y2="855" stroke="#5eead4" stroke-width="2"/>
  <line x1="500" y1="838" x2="270" y2="853" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="838" x2="730" y2="853" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- loop back from reply to decision engine -->
  <path d="M 730 945 L 730 990 L 500 990" fill="none" stroke="#3a4a5c" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDim)"/>
  <text x="620" y="983" text-anchor="middle" fill="#7d8ea3" font-size="9.5">feeds back into next decision cycle</text>

  <line x1="270" y1="945" x2="270" y2="990" stroke="#5eead4" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Outcome Tracking / Dashboard ===== -->
  <rect x="200" y="995" width="600" height="80" rx="8" fill="#12213a" stroke="#5eead4" stroke-width="1.5"/>
  <text x="500" y="1023" text-anchor="middle" fill="#e6edf3" font-size="15" font-weight="700">Outcome Tracking → Dashboard</text>
  <text x="500" y="1043" text-anchor="middle" fill="#9fb0c3" font-size="11">₹ recovered, recovery rate, cause breakdown, escalation queue,</text>
  <text x="500" y="1059" text-anchor="middle" fill="#9fb0c3" font-size="11">per-payment ledger-style audit trail</text>

  <!-- ===== Audit trail side rail ===== -->
  <line x1="150" y1="130" x2="150" y2="1035" stroke="#3a4a5c" stroke-width="1.5" stroke-dasharray="2,5"/>
  <line x1="150" y1="1035" x2="200" y2="1035" stroke="#3a4a5c" stroke-width="1.5" stroke-dasharray="2,5"/>
  <text x="150" y="115" text-anchor="middle" fill="#7d8ea3" font-size="10.5" font-weight="700">AUDIT TRAIL</text>
  <text x="120" y="580" fill="#7d8ea3" font-size="10.5" transform="rotate(-90 120 580)" text-anchor="middle">every step writes a reasoning row — nothing is inferred after the fact</text>

  <!-- ===== Guardrails legend box ===== -->
  <rect x="40" y="1110" width="920" height="150" rx="8" fill="#0f1b2d" stroke="#3a4a5c" stroke-width="1"/>
  <text x="65" y="1138" fill="#e6edf3" font-size="14" font-weight="700">What makes this "bounded and gated"</text>

  <circle cx="75" cy="1163" r="4" fill="#5eead4"/>
  <text x="88" y="1168" fill="#9fb0c3" font-size="11">Guardrails (retry caps, cooldowns, escalation) are deterministic rules — never LLM-controlled</text>

  <circle cx="75" cy="1186" r="4" fill="#5eead4"/>
  <text x="88" y="1191" fill="#9fb0c3" font-size="11">Reason-aware retry timing — cause-specific cooldowns modeled on real card-network guidance</text>

  <circle cx="75" cy="1209" r="4" fill="#5eead4"/>
  <text x="88" y="1214" fill="#9fb0c3" font-size="11">Human approval checkpoint — no customer is contacted without a merchant tap</text>

  <circle cx="75" cy="1232" r="4" fill="#5eead4"/>
  <text x="88" y="1237" fill="#9fb0c3" font-size="11">LLM action space is restricted to a fixed set — invalid output falls back to safe escalation</text>

  <circle cx="490" cy="1163" r="4" fill="#5eead4"/>
  <text x="503" y="1168" fill="#9fb0c3" font-size="11">Opt-out and promise-to-pay are hard-respected before any action is taken</text>

  <circle cx="490" cy="1186" r="4" fill="#5eead4"/>
  <text x="503" y="1191" fill="#9fb0c3" font-size="11">Every event, diagnosis, decision, and outcome is logged and viewable per-payment</text>

  <circle cx="490" cy="1209" r="4" fill="#5eead4"/>
  <text x="503" y="1214" fill="#9fb0c3" font-size="11">Gateway adapter layer — not hardcoded to one payment provider</text>

  <!-- Footer -->
  <text x="500" y="1300" text-anchor="middle" fill="#4a5a70" font-size="10.5">Recoup — Razorpay Buildathon, Track 03</text>
</svg>
